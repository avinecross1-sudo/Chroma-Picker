# Builds the Tauri desktop app for Windows and keeps the installers as a downloadable artifact.
name: Desktop app (Tauri)

on:
  workflow_dispatch:
  push:
    paths:
      - "plugin/**"
      - "desktop/gpu/**"
      - "desktop/build/icon.png"
      - "desktop-tauri/**"
      - ".github/workflows/desktop-tauri.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      - run: npm run copy-ui
      - run: npx tauri build --bundles nsis msi
      - name: Collect the installers and a portable zip
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Compress-Archive -Path "src-tauri/target/release/chroma-picker.exe" -DestinationPath "out/ChromaPicker-$v-win-x64-portable.zip"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaPicker-windows
          path: desktop-tauri/out/*

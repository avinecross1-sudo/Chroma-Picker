# Builds the Tauri desktop app for Windows and keeps the installers as a downloadable artifact.
name: Desktop app (Tauri)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (for example v1.9.0); leave empty to only build"
        required: false
        default: ""
  push:
    # a version tag such as v1.9.0 also publishes the build as a GitHub release
    tags: ["v*"]
    paths:
      - "plugin/**"
      - "desktop/gpu/**"
      - "desktop/build/icon.png"
      - "desktop-tauri/**"
      - ".github/workflows/desktop-tauri.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - run: npm install
      - run: npm run copy-ui
      - run: npx tauri build --bundles nsis msi
      - name: Collect the installers and a portable zip
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Compress-Archive -Path "src-tauri/target/release/chroma-picker.exe" -DestinationPath "out/ChromaPicker-$v-win-x64-portable.zip"
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ChromaPicker-windows
          path: desktop-tauri/out/*
      - name: Publish the release (version tags, or a run started with a release tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Chroma Picker ${{ inputs.release || github.ref_name }}
          files: |
            desktop-tauri/out/*
            dist/ChromaPicker.ccx
          body: |
            **Desktop app (Windows):** download the portable zip (unzip and run `chroma-picker.exe`) or the `-setup.exe` installer. Windows 10 and 11 already include the WebView2 runtime it uses. The builds are not code signed, so SmartScreen warns the first time: choose More info > Run anyway.

            **Photoshop plugin:** `ChromaPicker.ccx`.

            See README.md for what's new.
